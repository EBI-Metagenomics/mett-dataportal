name: Production - Build and Publish ME TT Data Portal Images (Django APIs & React App)

on:
  workflow_dispatch:

env:
  REGISTRY: dockerhub.ebi.ac.uk
  IMAGE_NAMESPACE: microbiome-informatics/containers
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  # Job to build and push Django API image
  prod-build-and-push-django:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to EBI GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_CONTAINERS_USERNAME }}
          password: ${{ secrets.GITLAB_CONTAINERS_PASSWORD }}

      - name: Build the Django Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-api:${{ env.IMAGE_TAG }} -f ./dataportal_api/Dockerfile .

      - name: Push the Django Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-api:${{ env.IMAGE_TAG }}

  # Job to build and push React app image
  prod-build-and-push-react:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to EBI GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_CONTAINERS_USERNAME }}
          password: ${{ secrets.GITLAB_CONTAINERS_PASSWORD }}

      - name: Build the React Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-react-app:${{ env.IMAGE_TAG }} -f ./dataportal-app/Dockerfile .

      - name: Push the React Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-react-app:${{ env.IMAGE_TAG }}
