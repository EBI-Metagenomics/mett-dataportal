name: Dev - Build and Publish ME TT Data Portal Images (Django APIs & React App)

on:
  workflow_dispatch:

env:
  REGISTRY: dockerhub.ebi.ac.uk
  IMAGE_NAMESPACE: microbiome-informatics/containers
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  # Dev build for Django API
  build-and-push-django-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to EBI GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_CONTAINERS_USERNAME }}
          password: ${{ secrets.GITLAB_CONTAINERS_PASSWORD }}

      - name: Build the Django Docker image
        run: |
          echo "$DOCKER_CONFIG_JSON" > ~/.docker/config.json

      - name: Build the Django Docker image (Dev)
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-api:${{ env.IMAGE_TAG }} \
            --build-arg DJANGO_FORCE_SCRIPT_NAME=/apidev \
            --build-arg DJANGO_STATIC_URL=/apidev-static/ \
            -f ./dataportal_api/Dockerfile .

      - name: Push the Django Docker image (Dev)
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-api:${{ env.IMAGE_TAG }}

  # Dev build for React app
  build-and-push-react-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to EBI GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_CONTAINERS_USERNAME }}
          password: ${{ secrets.GITLAB_CONTAINERS_PASSWORD }}

      - name: Build the React Docker image (Dev)
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-react-app:${{ env.IMAGE_TAG }} \
            --build-arg VITE_BASENAME=/appdev \
            -f ./dataportal-app/Dockerfile .

      - name: Push the React Docker image (Dev)
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/mett-dataportal-react-app:${{ env.IMAGE_TAG }}
