name: Quay.io - Build and Publish ME TT Data Portal Images (Django APIs & React App)

on:
  workflow_dispatch:

# Temporary backup registry while office GitLab is unreliable.
# Image names match the Quay repos (not the GitLab/EBI *-react-app name).
#
# Build contexts stay in sync with .gitlab-ci.yml and mett-build-publish-prod.yml:
#   api:  -f dataportal_api/Dockerfile .
#   app:  -f dataportal-app/Dockerfile .

env:
  QUAY_NAMESPACE: vikasguptaebi
  BACKEND_IMAGE: mett-dataportal-api
  FRONTEND_IMAGE: mett-dataportal-app
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  quay-build-and-push-django:
    permissions:
      contents: read
    name: Build and push API image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        env:
          DOCKER_CONFIG_JSON: ${{ secrets.QUAY_DOCKER_CONFIG }}
        run: |
          mkdir -p ~/.docker
          echo "$DOCKER_CONFIG_JSON" > ~/.docker/config.json

      - name: Build the Django Docker image
        run: |
          docker build \
            -t quay.io/${{ env.QUAY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            -f ./dataportal_api/Dockerfile \
            .

      - name: Push the Django Docker image
        run: |
          docker push quay.io/${{ env.QUAY_NAMESPACE }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

  quay-build-and-push-react:
    permissions:
      contents: read
    name: Build and push React app image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Quay.io
        env:
          DOCKER_CONFIG_JSON: ${{ secrets.QUAY_DOCKER_CONFIG }}
        run: |
          mkdir -p ~/.docker
          echo "$DOCKER_CONFIG_JSON" > ~/.docker/config.json

      - name: Build the React Docker image
        run: |
          docker build \
            -t quay.io/${{ env.QUAY_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            -f ./dataportal-app/Dockerfile \
            .

      - name: Push the React Docker image
        run: |
          docker push quay.io/${{ env.QUAY_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
